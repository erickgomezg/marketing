<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1424">
  <meta name="description" content="JL Creative Studio: estrategia, creatividad y soluciones digitales para marcas y negocios.">
  <title>JL Creative Studio | Próximamente</title>
  <style>
    :root { color-scheme: dark; --navy:#0b1424; --gold:#d7b56d; --muted:#aab4c4; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px 20px; color:#f7f8fb; background:radial-gradient(ellipse at 50% 0%,#1b2b46 0%,var(--navy) 58%); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(760px,100%); text-align:center; }
    .monogram { width:76px;height:76px;margin:0 auto 26px;display:grid;place-items:center;border:1px solid rgba(215,181,109,.65);border-radius:22px;color:var(--gold);font-family:Georgia,serif;font-size:27px;letter-spacing:-3px; }
    .eyebrow { color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase; }
    h1 { margin:18px 0 12px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,8vw,68px);font-weight:500;letter-spacing:-.045em; }
    h1 span { color:var(--gold); }
    p { max-width:570px;margin:0 auto;color:var(--muted);font-size:17px;line-height:1.8; }
    .rule { width:54px;height:1px;margin:30px auto;background:var(--gold); }
    .status { display:inline-flex;align-items:center;gap:9px;margin-top:10px;padding:10px 15px;border:1px solid rgba(215,181,109,.25);border-radius:999px;color:#e6d4ad;font-size:12px;letter-spacing:.08em;text-transform:uppercase; }
    .dot { width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold); }
    footer { margin-top:76px;color:#778397;font-size:12px;letter-spacing:.08em; }
  </style>
</head>
<body>
  <main>
    <div class="monogram" aria-hidden="true">JL</div>
    <div class="eyebrow">Creatividad · Estrategia · Tecnología</div>
    <h1>JL Creative <span>Studio</span></h1>
    <p>Estamos preparando un espacio donde las ideas se convierten en experiencias y las marcas encuentran nuevas formas de crecer.</p>
    <div class="rule"></div>
    <div class="status"><span class="dot"></span> Sitio web en construcción</div>
    <footer>© <span id="year">2026</span> JL Creative Studio. Todos los derechos reservados.</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
