name: ai-marketing-manager

services:
  frontend:
    image: ai-marketing-manager-frontend:dev
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    expose: ["5173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [web]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-ai_marketing_manager}
      POSTGRES_USER: ${PGUSER:-app_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=30", "-c", "effective_cache_size=256MB"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [data]

  database-init:
    build: ./backend
    command: ["npm", "run", "init:database"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-ai_marketing_manager}
      PGUSER: ${PGUSER:-app_user}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-ai_marketing_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      PG_POOL_MAX: 2
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  admin-bootstrap:
    build: ./backend
    command: ["npm", "run", "bootstrap:admin"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-ai_marketing_manager}
      PGUSER: ${PGUSER:-app_user}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      PG_POOL_MAX: 1
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:?Set BOOTSTRAP_ADMIN_NAME in .env}
    depends_on:
      database-init:
        condition: service_completed_successfully
    networks: [data]

  backend:
    image: ai-marketing-manager-backend:dev
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-3000}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-ai_marketing_manager}
      PGUSER: ${APP_DB_USER:-ai_marketing_app}
      PGPASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      PG_POOL_MAX: ${PG_POOL_MAX:-4}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env}
      AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-15}
      AUTH_REFRESH_TOKEN_DAYS: ${AUTH_REFRESH_TOKEN_DAYS:-7}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-72}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      DEV_RETURN_ACTION_LINKS: ${DEV_RETURN_ACTION_LINKS:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/api/auth/google/callback}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_REDIRECT_URI: ${META_REDIRECT_URI:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v27.0}
      META_SCOPES: ${META_SCOPES:-pages_show_list,pages_read_engagement,read_insights,pages_manage_posts,pages_read_user_content,pages_manage_engagement,instagram_basic,instagram_manage_insights,instagram_content_publish,instagram_manage_comments,ads_read}
      META_TOKEN_ENCRYPTION_KEY: ${META_TOKEN_ENCRYPTION_KEY:-}
      WHATSAPP_WORKER_URL: http://whatsapp-worker:3100
      WHATSAPP_INTERNAL_TOKEN: ${WHATSAPP_INTERNAL_TOKEN:?Set WHATSAPP_INTERNAL_TOKEN in .env}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-marketing-manager}
    expose: ["3000"]
    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
      admin-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      whatsapp-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [web, data]

  whatsapp-worker:
    image: ai-marketing-manager-whatsapp-worker:dev
    build: ./whatsapp-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3100
      WHATSAPP_AUTH_PATH: /app/auth
      WHATSAPP_INTERNAL_TOKEN: ${WHATSAPP_INTERNAL_TOKEN:?Set WHATSAPP_INTERNAL_TOKEN in .env}
    volumes:
      - whatsapp_auth:/app/auth
    expose: ["3100"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    dns:
      - 66.228.62.5
      - 173.230.128.5
    networks: [data, whatsapp-egress]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [data]

  minio:
    image: chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    expose: ["9000", "9001"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; IFS= read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [data]

  minio-init:
    build: ./backend
    command: ["npm", "run", "init:bucket"]
    restart: "no"
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-marketing-manager}
    depends_on:
      minio:
        condition: service_healthy
    networks: [data]

  nginx:
    build: ./infrastructure/nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      API_PORT: ${API_PORT:-3000}
      NGINX_ENVSUBST_FILTER: ^API_PORT$
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks: [web]

volumes:
  postgres_data:
  redis_data:
  whatsapp_auth:
  minio_data:
  # Legacy data is retained; this volume is intentionally not mounted by the PostgreSQL stack.
  sqlserver_data:

networks:
  web:
  data:
    internal: true
  whatsapp-egress:
    driver: bridge
