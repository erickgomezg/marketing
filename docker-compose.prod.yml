services:
  frontend:
    image: ai-marketing-manager-frontend:prod
    build:
      context: ./frontend
      target: production
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    image: ai-marketing-manager-backend:prod
    build: ./backend
    environment:
      NODE_ENV: production
      PG_POOL_MAX: ${PG_POOL_MAX:-4}

  nginx:
    volumes:
      - ./infrastructure/nginx/default.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
